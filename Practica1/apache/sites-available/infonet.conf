<VirtualHost *:8093>
    ServerName infonet.local
    ServerAlias www.infonet.local
    DocumentRoot /var/www/infonet.local
    DirectoryIndex infonet.html

    <Directory /var/www/infonet.local>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

     <Directory /var/www/infonet.local/privado>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>


    ErrorLog ${APACHE_LOG_DIR}/infonet_error.log
    CustomLog ${APACHE_LOG_DIR}/infonet_access.log combined
</VirtualHost>

<VirtualHost *:8093>
    ServerName infoweb.local
    ServerAlias www.infoweb.local
    DocumentRoot /var/www/infoweb.local
    DirectoryIndex infoweb.html

    <Directory /var/www/infoweb.local>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/infoweb_error.log
    CustomLog ${APACHE_LOG_DIR}/infoweb_access.log combined
</VirtualHost>

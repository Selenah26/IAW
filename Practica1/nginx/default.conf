limit_req_zone $binary_remote_addr zone=iaw_limit:10m rate=5r/s;

server {
    listen 80 default_server;
    server_name infoweb.local infonet.local _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name infoweb.local infonet.local _;

    ssl_certificate /etc/nginx/certs/selena.crt;
    ssl_certificate_key /etc/nginx/certs/selena.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        limit_req zone=iaw_limit burst=3 nodelay;
        proxy_pass http://web:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
